<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        [title^=C]{
            color: red;
        }
        [title$=b]{
            color: blue;
        }
        [title*=o]{
            color: green;
        }
    </style>
</head>
<body>
    <div title=China>中国</div>
    <div title="cab">北京</div>
    <div title="holle">天津</div>
</body>
</html>
